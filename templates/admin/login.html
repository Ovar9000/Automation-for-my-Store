<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Sari-Sari Store POS</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Prevent theme flash script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('admin_theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('admin-dark');
      } else {
        document.documentElement.classList.remove('admin-dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gradient-to-tr from-sky-100 to-slate-50 min-h-screen flex items-center justify-center font-sans p-4 antialiased admin-layout">

  <div x-data="{
    password: '',
    error: '',
    isLoading: false,
    async login() {
      if (!this.password) {
        this.error = 'Please enter password';
        return;
      }
      this.isLoading = true;
      this.error = '';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: this.password })
        });
        const result = await res.json();
        if (result.success) {
          sessionStorage.setItem('admin_auth', 'true');
          window.location.href = '/admin/dashboard';
        } else {
          this.error = result.message || 'Incorrect password';
          this.password = '';
        }
      } catch (err) {
        this.error = 'Server connection error';
      } finally {
        this.isLoading = false;
      }
    }
  }" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100 transition-all duration-300">
    
    <!-- Header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 mb-4 shadow-inner">
        <!-- SVG Store Bag Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight text-center">Sari-Sari Store POS</h1>
      <p class="text-slate-400 text-sm mt-1">Administrator Portal</p>
    </div>

    <!-- Error Box -->
    <div x-show="error" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="mb-6 p-4 bg-red-50 text-red-600 text-sm rounded-xl border border-red-100 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 flex-shrink-0">
        <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-8-5a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5A.75.75 0 0 1 10 5Zm0 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
      </svg>
      <span x-text="error"></span>
    </div>

    <!-- Login Form -->
    <form @submit.prevent="login()" class="space-y-6">
      <div>
        <label for="password" class="block text-sm font-semibold text-slate-600 mb-2">Admin Password</label>
        <input type="password" 
               id="password" 
               x-model="password" 
               placeholder="••••••••" 
               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:bg-white transition-all text-center text-lg font-mono tracking-widest text-slate-700"
               autofocus>
      </div>

      <button type="submit" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 flex items-center justify-center gap-2"
              :disabled="isLoading">
        <svg x-show="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span x-text="isLoading ? 'Verifying...' : 'Login Access'"></span>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between text-sm text-slate-500">
      <a href="/" class="hover:text-blue-600 transition-colors flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
          <path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z" clip-rule="evenodd" />
        </svg>
        Back to Cashier
      </a>
      <span>POS App v1.0</span>
    </div>

  </div>

</body>
</html>
