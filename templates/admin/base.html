<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sari-Sari Store Admin{% endblock %}</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/custom.css">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 font-sans min-h-screen antialiased flex flex-col admin-layout" {% block alpine_app %}{% endblock %}>

  <!-- Top Nav Bar -->
  <nav class="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center gap-8">
          <div class="flex-shrink-0 flex items-center gap-2 font-bold text-slate-800 text-lg">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                <path fill-rule="evenodd" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" clip-rule="evenodd" />
              </svg>
            </div>
            Sari-Sari Store Admin
          </div>
          <div class="hidden md:flex space-x-4">
            <a href="/admin/dashboard" class="{% if active_page == 'dashboard' or request.url.path == '/admin/dashboard' %}border-blue-500 text-blue-600 border-b-2{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 border-b-2{% endif %} px-3 py-2 text-sm font-semibold flex items-center gap-2">
              Dashboard
            </a>
            <a href="/admin/inventory" class="{% if active_page == 'inventory' or request.url.path == '/admin/inventory' %}border-blue-500 text-blue-600 border-b-2{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 border-b-2{% endif %} px-3 py-2 text-sm font-semibold flex items-center gap-2">
              Inventory
            </a>
            <a href="/admin/gcash" class="{% if active_page == 'gcash' or request.url.path == '/admin/gcash' %}border-blue-500 text-blue-600 border-b-2{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 border-b-2{% endif %} px-3 py-2 text-sm font-semibold flex items-center gap-2">
              GCash Services
            </a>
            <a href="/admin/reports" class="{% if active_page == 'reports' or request.url.path == '/admin/reports' %}border-blue-500 text-blue-600 border-b-2{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 border-b-2{% endif %} px-3 py-2 text-sm font-semibold flex items-center gap-2">
              Reports
            </a>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <a href="/" class="text-slate-500 hover:text-slate-700 text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors">
            Cashier Mode
          </a>
          <button @click="logout ? logout() : (sessionStorage.removeItem('admin_auth'), window.location.href='/admin')" class="text-red-500 hover:text-red-700 text-sm font-semibold px-3 py-2 rounded-lg hover:bg-red-50 transition-colors">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
